[workspace]
name = "rpa-pscf-io"
version = "0.1.0"
description = "RPA free energy computation and optimization for block copolymer systems"
channels = ["pytorch", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"
pytorch = { version = ">=2.0", channel = "pytorch" }
numpy = ">=1.24"
h5py = ">=3.8"
matplotlib = ">=3.7"
pytest = ">=7.0"
scikit-image = ">=0.26.0,<0.27"
tqdm = ">=4.65"

[pypi-dependencies]
rpa = { path = ".", editable = true }

[tasks]
test = "pytest tests/ -v"
gen-input = "python scripts/generate_input.py"
optimize = "python scripts/optimize_density.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa"
version = "0.1.0"
description = "RPA free-energy computation and optimization for block copolymer systems"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "scikit-image>=0.26,<0.27",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- pixi  --- #
[tool.pixi.project]
name = "rpa-pscf-io"
channels = ["pytorch", "conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
pytorch = { version = ">=2.0", channel = "pytorch" }
numpy = ">=1.24"
h5py = ">=3.8"
matplotlib = ">=3.7"
scikit-image = ">=0.26.0,<0.27"
tqdm = ">=4.65"
pytest = ">=7.0"

[tool.pixi.pypi-dependencies]
rpa = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest tests/ -v"
gen-input = "python scripts/generate_input.py"
optimize = "python scripts/optimize_density.py"
